<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title"><title id="title">Generated test case output preview</title><rect width="1400" height="760" rx="24" fill="#101323"/><rect x="42" y="36" width="1316" height="688" rx="20" fill="#20223a"/><text x="82" y="92" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Generated suite · ready to review and export</text><text x="82" y="126" fill="#a8abc4" font-family="Arial" font-size="15">Structured cases, coverage checks, and automation previews in one workspace.</text><rect x="82" y="165" width="1236" height="82" rx="14" fill="#171a2d"/><text x="110" y="198" fill="#a8abc4" font-family="Arial" font-size="13">QUALITY GATES</text><text x="110" y="226" fill="#72e6a4" font-family="Arial" font-size="16" font-weight="700">✓ Unique IDs</text><text x="320" y="226" fill="#72e6a4" font-family="Arial" font-size="16" font-weight="700">✓ No duplicate scenarios</text><text x="650" y="226" fill="#72e6a4" font-family="Arial" font-size="16" font-weight="700">✓ Required fields</text><text x="895" y="226" fill="#72e6a4" font-family="Arial" font-size="16" font-weight="700">✓ Category consistency</text><rect x="82" y="278" width="600" height="382" rx="14" fill="#292c49"/><text x="112" y="323" fill="#ff75c5" font-family="Arial" font-size="13" font-weight="700">TEST CASE DETAIL</text><text x="112" y="366" fill="#fff" font-family="Arial" font-size="22" font-weight="700">TC014 · Boundary</text><text x="112" y="407" fill="#d7d8e8" font-family="Arial" font-size="15">Scenario</text><text x="112" y="433" fill="#fff" font-family="Arial" font-size="15">Accepts the maximum allowed input length</text><text x="112" y="482" fill="#d7d8e8" font-family="Arial" font-size="15">Expected result</text><text x="112" y="508" fill="#fff" font-family="Arial" font-size="15">The value is accepted without truncation.</text><text x="112" y="557" fill="#d7d8e8" font-family="Arial" font-size="15">Steps</text><text x="112" y="583" fill="#fff" font-family="Arial" font-size="15">1. Enter the maximum valid value</text><text x="112" y="609" fill="#fff" font-family="Arial" font-size="15">2. Submit the form</text><rect x="718" y="278" width="600" height="382" rx="14" fill="#292c49"/><text x="748" y="323" fill="#ff75c5" font-family="Arial" font-size="13" font-weight="700">EXPORT &amp; AUTOMATION</text><rect x="748" y="355" width="240" height="58" rx="11" fill="#ff4fba"/><text x="813" y="391" fill="#fff" font-family="Arial" font-size="16" font-weight="700">Download JSON</text><rect x="1006" y="355" width="240" height="58" rx="11" fill="#3e4268"/><text x="1073" y="391" fill="#fff" font-family="Arial" font-size="16" font-weight="700">Download CSV</text><rect x="748" y="450" width="498" height="150" rx="10" fill="#151827"/><text x="772" y="482" fill="#a8abc4" font-family="Arial" font-size="13">TC014.spec.ts · Playwright preview</text><text x="772" y="518" fill="#72e6a4" font-family="Courier New" font-size="14">test('maximum input', async ({ page }) =&gt; {</text><text x="772" y="544" fill="#d7d8e8" font-family="Courier New" font-size="14">  await page.fill('#value', maxValue);</text><text x="772" y="570" fill="#d7d8e8" font-family="Courier New" font-size="14">  await expect(page.locator('#result')).toBeVisible();</text></svg>