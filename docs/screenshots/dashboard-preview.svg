<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">AI Test Case Generator dashboard preview</title><desc id="desc">A polished dashboard showing story input, generated coverage metrics, and test cases.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#101323"/><stop offset="1" stop-color="#19152b"/></linearGradient><linearGradient id="pink" x1="0" x2="1"><stop stop-color="#ff4fba"/><stop offset="1" stop-color="#9b6cff"/></linearGradient></defs><rect width="1400" height="820" rx="26" fill="url(#bg)"/><rect x="42" y="36" width="1316" height="70" rx="18" fill="#20223a"/><circle cx="78" cy="71" r="15" fill="#ff4fba"/><text x="108" y="78" fill="#fff" font-family="Arial" font-size="24" font-weight="700">Synthetix QA</text><text x="1185" y="78" fill="#a8abc4" font-family="Arial" font-size="15">AI Test Case Generator</text><rect x="42" y="132" width="450" height="638" rx="20" fill="#20223a"/><text x="72" y="175" fill="#ff75c5" font-family="Arial" font-size="13" font-weight="700">1 / STORY INPUT</text><text x="72" y="216" fill="#fff" font-family="Arial" font-size="27" font-weight="700">Tell us what to test</text><text x="72" y="263" fill="#a8abc4" font-family="Arial" font-size="13">Feature</text><rect x="72" y="276" width="390" height="48" rx="10" fill="#16182a" stroke="#3b3d59"/><text x="88" y="307" fill="#f3f4ff" font-family="Arial" font-size="15">Secure authentication</text><text x="72" y="357" fill="#a8abc4" font-family="Arial" font-size="13">What should the user be able to do?</text><rect x="72" y="370" width="390" height="92" rx="10" fill="#16182a" stroke="#3b3d59"/><text x="88" y="402" fill="#f3f4ff" font-family="Arial" font-size="14">As a user, I want to sign in</text><text x="88" y="425" fill="#f3f4ff" font-family="Arial" font-size="14">so I can access my dashboard.</text><rect x="72" y="492" width="390" height="55" rx="10" fill="#292c49" stroke="#52567b"/><text x="92" y="525" fill="#fff" font-family="Arial" font-size="14">↥  Import TXT, PDF, PNG, JPG</text><rect x="72" y="580" width="390" height="52" rx="12" fill="url(#pink)"/><text x="171" y="613" fill="#fff" font-family="Arial" font-size="16" font-weight="700">Generate test cases</text><rect x="518" y="132" width="840" height="638" rx="20" fill="#20223a"/><text x="552" y="176" fill="#ff75c5" font-family="Arial" font-size="13" font-weight="700">2 / COVERAGE RESULTS</text><text x="552" y="216" fill="#fff" font-family="Arial" font-size="27" font-weight="700">Your QA suite, ready to review</text><g font-family="Arial"><rect x="552" y="250" width="180" height="102" rx="14" fill="#292c49"/><text x="572" y="280" fill="#a8abc4" font-size="13">Total generated</text><text x="572" y="326" fill="#fff" font-size="34" font-weight="700">48</text><rect x="750" y="250" width="180" height="102" rx="14" fill="#292c49"/><text x="770" y="280" fill="#a8abc4" font-size="13">Coverage profile</text><text x="770" y="326" fill="#72e6a4" font-size="34" font-weight="700">100%</text><rect x="948" y="250" width="180" height="102" rx="14" fill="#292c49"/><text x="968" y="280" fill="#a8abc4" font-size="13">QA hours saved</text><text x="968" y="326" fill="#c39bff" font-size="34" font-weight="700">6.4h</text></g><rect x="552" y="382" width="770" height="76" rx="14" fill="#171a2d"/><text x="577" y="413" fill="#a8abc4" font-family="Arial" font-size="13">COVERAGE BREAKDOWN</text><text x="577" y="438" fill="#fff" font-family="Arial" font-size="14">Positive</text><text x="700" y="438" fill="#72e6a4" font-family="Arial" font-size="20" font-weight="700">8</text><text x="805" y="438" fill="#fff" font-family="Arial" font-size="14">Negative</text><text x="915" y="438" fill="#ffcf70" font-family="Arial" font-size="20" font-weight="700">14</text><text x="1020" y="438" fill="#fff" font-family="Arial" font-size="14">Boundary</text><text x="1130" y="438" fill="#ff75c5" font-family="Arial" font-size="20" font-weight="700">9</text><text x="1215" y="438" fill="#fff" font-family="Arial" font-size="14">Edge</text><text x="1280" y="438" fill="#c39bff" font-family="Arial" font-size="20" font-weight="700">17</text><text x="552" y="505" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Generated test cases</text><rect x="552" y="530" width="770" height="58" rx="10" fill="#292c49"/><circle cx="580" cy="559" r="8" fill="#72e6a4"/><text x="604" y="565" fill="#fff" font-family="Arial" font-size="14" font-weight="700">TC001</text><text x="686" y="565" fill="#d7d8e8" font-family="Arial" font-size="14">Valid user signs in with correct credentials</text><rect x="552" y="600" width="770" height="58" rx="10" fill="#292c49"/><circle cx="580" cy="629" r="8" fill="#ffcf70"/><text x="604" y="635" fill="#fff" font-family="Arial" font-size="14" font-weight="700">TC002</text><text x="686" y="635" fill="#d7d8e8" font-family="Arial" font-size="14">Rejects an expired password reset token</text><rect x="552" y="670" width="770" height="58" rx="10" fill="#292c49"/><circle cx="580" cy="699" r="8" fill="#ff75c5"/><text x="604" y="705" fill="#fff" font-family="Arial" font-size="14" font-weight="700">TC003</text><text x="686" y="705" fill="#d7d8e8" font-family="Arial" font-size="14">Handles maximum allowed password length</text></svg>